# Save in the repo as: .github/workflows/render-video.yml
# PUBLIC repo safe: the only input is "data", an AES-GCM encrypted blob (script, upload URL, job id are inside it).
name: render-video
on:
  workflow_dispatch:
    inputs:
      data: { description: "encrypted job", required: true }
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-noto-core fonts-dejavu-core
          pip install edge-tts pillow numpy arabic-reshaper python-bidi requests cryptography
      - name: Render
        env:
          DATA: ${{ inputs.data }}
          CALLBACK_SECRET: ${{ secrets.CALLBACK_SECRET }}
        run: python render.py
